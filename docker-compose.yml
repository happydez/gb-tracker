# The gb-tracker deployment: a broker, the tracker, and the notifier.
#
# A service written against the tracker is deployed on its own, from its own
# compose file, and reaches the broker over the network named below. That is
# the whole interface between the two deployments.

services:
  nats:
    image: nats:alpine
    # -js turns JetStream on and -sd points its store at the volume: without
    # both, the stream lives in memory and a restart loses everything unread.
    # -m 8222 enables the monitoring endpoint the healthcheck below polls,
    # which is off by default.
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    networks: [gbtracker]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  tracker:
    build:
      context: .
      args:
        PKG: ./cmd/tracker
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped
    user: "${GB_UID:-1000}:${GB_GID:-1000}"
    networks: [gbtracker]
    volumes:
      - ./data:/data
      - ./config.yaml:/etc/gbtracker/config.yaml:ro
    command: ["-config", "/etc/gbtracker/config.yaml"]

  notifier:
    build:
      context: .
      args:
        PKG: ./cmd/notifier
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped
    environment:
      GB_DISCORD_WEBHOOK_PUBLIC: ${GB_DISCORD_WEBHOOK_PUBLIC}
      GB_DISCORD_WEBHOOK_PRIVATE: ${GB_DISCORD_WEBHOOK_PRIVATE}
    networks: [gbtracker]
    volumes:
      - ./notifier.yaml:/etc/gbtracker/notifier.yaml:ro
    command: ["-config", "/etc/gbtracker/notifier.yaml"]

networks:
  gbtracker:
    name: gbtracker

volumes:
  nats-data:
