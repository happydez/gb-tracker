version: '3'

vars:
  LOCAL_BIN: './bin'
  GOLANGCI_VERSION: latest

tasks:
  info:
    cmds:
      - task --list
    silent: true

  install-golangci-lint:
    desc: Install golangci-lint into ./bin
    status:
      - test -x {{.LOCAL_BIN}}/golangci-lint
    cmds:
      - GOBIN="$(pwd)/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_VERSION}}

  lint:
    desc: Run linters
    deps: [install-golangci-lint]
    cmds:
      - '{{.LOCAL_BIN}}/golangci-lint{{exeExt}} run ./...'

  lint-fix:
    desc: Run linters with autofix
    deps: [install-golangci-lint]
    cmds:
      - '{{.LOCAL_BIN}}/golangci-lint{{exeExt}} run ./... --fix'

  test:
    desc: Run all tests
    cmds:
      - go test ./... -cover

  test-integration:
    desc: Run the tests that need a live NATS, starting one in docker
    cmds:
      - docker rm -f gbtracker-test-nats || true
      - docker run -d --name gbtracker-test-nats -p 14222:4222 nats:alpine -js
      - defer: docker rm -f gbtracker-test-nats
      - GB_TRACKER_TEST_NATS=nats://127.0.0.1:14222 go test ./... -count=1

  build:
    desc: Build every service into ./bin
    deps: [build-tracker, build-notifier]

  build-tracker:
    desc: Build the tracker
    cmds:
      - CGO_ENABLED=0 go build -o {{.LOCAL_BIN}}/tracker{{exeExt}} ./cmd/tracker

  build-notifier:
    desc: Build the notifier
    cmds:
      - CGO_ENABLED=0 go build -o {{.LOCAL_BIN}}/notifier{{exeExt}} ./cmd/notifier

  run-tracker:
    desc: Run the tracker against ./config.yaml
    deps: [build-tracker]
    cmds:
      - '{{.LOCAL_BIN}}/tracker{{exeExt}} -config config.yaml'

  run-notifier:
    desc: Run the notifier against ./notifier.yaml
    deps: [build-notifier]
    cmds:
      - '{{.LOCAL_BIN}}/notifier{{exeExt}} -config notifier.yaml'
